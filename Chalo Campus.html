02Fhelmet>\n\n<div style=\"min-height:100%;background:#F6F5F1;font-family:'DM Sans',system-ui,sans-serif;color:#1D2230\" data-canvas-width=\"1280\" data-canvas-height=\"4300\">\n\n<!-- NAV -->\n<header style=\"max-width:1120px;margin:0 auto;padding:20px 24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;box-sizing:border-box\">\n<div style=\"display:flex;align-items:center;gap:10px\">\n<svg width=\"36\" height=\"30\" sc-camel-view-box=\"0 0 36 30\" fill=\"none\" aria-hidden=\"true\"><circle cx=\"13\" cy=\"15\" r=\"12\" fill=\"{{accent}}\"><\u002Fcircle><circle cx=\"23\" cy=\"15\" r=\"12\" fill=\"#0E7561\" fill-opacity=\"0.85\"><\u002Fcircle><\u002Fsvg>\n<span style=\"font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;font-weight:800;font-size:26px;letter-spacing:-0.02em\">chalo<\u002Fspan>\n<\u002Fdiv>\n<nav style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;font-size:16px;font-weight:500\">\n<a href=\"#plans\" style=\"color:#1D2230;text-decoration:none;padding:10px 0\">Plans<\u002Fa>\n<a href=\"#safety\" style=\"color:#1D2230;text-decoration:none;padding:10px 0\">Safety<\u002Fa>\n<a href=\"#money\" style=\"color:#1D2230;text-decoration:none;padding:10px 0\">Bookings<\u002Fa>\n<a href=\"#launch\" style=\"display:inline-flex;align-items:center;min-height:44px;padding:0 20px;border-radius:999px;background:#1D2230;color:#FFFFFF;text-decoration:none;font-weight:700\">Get on the list<\u002Fa>\n<\u002Fnav>\n<\u002Fheader>\n\n<!-- HERO -->\n<section style=\"max-width:1120px;margin:0 auto;padding:32px 24px 64px;display:flex;flex-wrap:wrap;gap:48px;align-items:flex-start;box-sizing:border-box\">\n<div style=\"flex:1 1 440px;min-width:0;display:flex;flex-direction:column;gap:24px;padding-top:16px\">\n<div style=\"align-self:flex-start;display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:#FFFFFF;border:1px solid #E3E0D6;font-size:14px;font-weight:500\">\n<svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><circle cx=\"8\" cy=\"8\" r=\"8\" fill=\"#0E7561\"><\u002Fcircle><path d=\"M4.5 8.3l2.2 2.2 4.8-4.8\" stroke=\"#fff\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\nSample College, Bengaluru · students only\n<\u002Fdiv>\n<h1 style=\"margin:0;font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;font-weight:800;font-size:clamp(40px,6vw,64px);line-height:1.04;letter-spacing:-0.025em;text-wrap:balance\">Going out? Don't go <span style=\"background:#FFE08A;padding:0 10px;border-radius:10px\">alone.<\u002Fspan><\u002Fh1>\n<p style=\"margin:0;font-size:19px;line-height:1.55;color:#4A4F5E;max-width:520px\">Post a plan and find people from your college who'd come along. Chai, football, a café, a movie, a walk. It doesn't have to be an official event.<\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;gap:12px;align-items:center\">\n<a href=\"#plans\" style=\"display:inline-flex;align-items:center;min-height:52px;padding:0 28px;border-radius:14px;background:{{accent}};color:#FFFFFF;font-weight:700;font-size:17px;text-decoration:none\">Find a plan<\u002Fa>\n<a href=\"#safety\" style=\"display:inline-flex;align-items:center;min-height:52px;padding:0 20px;font-weight:700;font-size:17px;color:#1D2230\">How we keep it safe<\u002Fa>\n<\u002Fdiv>\n<ul style=\"margin:8px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:10px 22px;font-size:15px;color:#4A4F5E\">\n<sc-for list=\"{{ trust }}\" as=\"t\" hint-placeholder-count=\"3\">\n<li style=\"display:flex;align-items:center;gap:8px\">\n<svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><circle cx=\"8\" cy=\"8\" r=\"8\" fill=\"#0E7561\"><\u002Fcircle><path d=\"M4.5 8.3l2.2 2.2 4.8-4.8\" stroke=\"#fff\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n{{t.text}}\n<\u002Fli>\n<\u002Fsc-for>\n<\u002Ful>\n<\u002Fdiv>\n\n<!-- CREATE A PLAN -->\n<div style=\"flex:1 1 400px;min-width:0;max-width:520px;background:#FFFFFF;border:1px solid #E3E0D6;border-radius:22px;padding:28px;display:flex;flex-direction:column;gap:20px;box-shadow:0 12px 36px rgba(29,34,48,0.08);box-sizing:border-box\">\n<div style=\"display:flex;flex-direction:column;gap:4px\">\n<h2 style=\"margin:0;font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;font-weight:800;font-size:26px;letter-spacing:-0.01em\">Start a plan<\u002Fh2>\n<p style=\"margin:0;font-size:15px;color:#4A4F5E\">20 seconds. Only students from your college see it.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<label for=\"plan-title\" style=\"font-size:13px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:#4A4F5E\">What's the plan?<\u002Flabel>\n<input id=\"plan-title\" type=\"text\" value=\"{{ titleValue }}\" sc-camel-on-input=\"{{ onTitle }}\" placeholder=\"Chai at 5? Anyone free?\" style=\"min-height:48px;border-radius:12px;border:1px solid #CFCBC0;padding:0 14px;font-size:16px;color:#1D2230;background:#FFFFFF;box-sizing:border-box;width:100%\">\n<sc-if value=\"{{ hasFormError }}\" hint-placeholder-val=\"{{ false }}\">\n<p role=\"alert\" style=\"margin:0;font-size:14px;color:#B3261E;font-weight:500\">{{formError}}<\u002Fp>\n<\u002Fsc-if>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<span style=\"font-size:13px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:#4A4F5E\">Type<\u002Fspan>\n<div role=\"group\" aria-label=\"Plan type\" style=\"display:flex;flex-wrap:wrap;gap:8px\">\n<sc-for list=\"{{ catChips }}\" as=\"c\" hint-placeholder-count=\"6\">\n<button type=\"button\" aria-pressed=\"{{c.on}}\" sc-camel-on-click=\"{{ c.pick }}\" style=\"min-height:44px;padding:0 16px;border-radius:999px;border:1px solid {{c.bd}};background:{{c.bg}};color:{{c.fg}};font-size:15px;font-weight:500;cursor:pointer\">{{c.label}}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<span style=\"font-size:13px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:#4A4F5E\">When<\u002Fspan>\n<div role=\"group\" aria-label=\"Plan time\" style=\"display:flex;flex-wrap:wrap;gap:8px\">\n<sc-for list=\"{{ timeChips }}\" as=\"c\" hint-placeholder-count=\"5\">\n<button type=\"button\" aria-pressed=\"{{c.on}}\" sc-camel-on-click=\"{{ c.pick }}\" style=\"min-height:44px;padding:0 16px;border-radius:999px;border:1px solid {{c.bd}};background:{{c.bg}};color:{{c.fg}};font-size:15px;font-weight:500;cursor:pointer\">{{c.label}}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<sc-if value=\"{{ lateOn }}\" hint-placeholder-val=\"{{ false }}\">\n<p style=\"margin:0;font-size:14px;line-height:1.5;color:#6B4A00;background:#FFF3D1;border-radius:10px;padding:10px 12px\">Plans after 8 PM need a verified host. We'll ask you to confirm your phone number before this goes live.<\u002Fp>\n<\u002Fsc-if>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<span style=\"font-size:13px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:#4A4F5E\">Where (public places only)<\u002Fspan>\n<div role=\"group\" aria-label=\"Venue\" style=\"display:flex;flex-wrap:wrap;gap:8px\">\n<sc-for list=\"{{ venueChips }}\" as=\"c\" hint-placeholder-count=\"7\">\n<button type=\"button\" aria-pressed=\"{{c.on}}\" sc-camel-on-click=\"{{ c.pick }}\" style=\"min-height:44px;padding:0 16px;border-radius:999px;border:1px solid {{c.bd}};background:{{c.bg}};color:{{c.fg}};font-size:15px;font-weight:500;cursor:pointer\">{{c.label}}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<p style=\"margin:0;font-size:14px;color:#4A4F5E\">You pick from a list of public venues. No private addresses.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-wrap:wrap;gap:20px 32px\">\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<span style=\"font-size:13px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:#4A4F5E\">People who can join<\u002Fspan>\n<div style=\"display:flex;align-items:center;gap:12px\">\n<button type=\"button\" aria-label=\"Fewer spots\" sc-camel-on-click=\"{{ spotsDown }}\" style=\"width:44px;height:44px;border-radius:50%;border:1px solid #CFCBC0;background:#FFFFFF;font-size:22px;color:#1D2230;cursor:pointer\">−<\u002Fbutton>\n<span style=\"min-width:28px;text-align:center;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums\">{{form.spots}}<\u002Fspan>\n<button type=\"button\" aria-label=\"More spots\" sc-camel-on-click=\"{{ spotsUp }}\" style=\"width:44px;height:44px;border-radius:50%;border:1px solid #CFCBC0;background:#FFFFFF;font-size:22px;color:#1D2230;cursor:pointer\">+<\u002Fbutton>\n<\u002Fdiv>\n<p style=\"margin:0;font-size:14px;color:#4A4F5E\">{{groupNote}}<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px;flex:1 1 200px;min-width:0\">\n<span style=\"font-size:13px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:#4A4F5E\">Cost per person<\u002Fspan>\n<div role=\"group\" aria-label=\"Cost per person\" style=\"display:flex;flex-wrap:wrap;gap:8px\">\n<sc-for list=\"{{ costChips }}\" as=\"c\" hint-placeholder-count=\"4\">\n<button type=\"button\" aria-pressed=\"{{c.on}}\" sc-camel-on-click=\"{{ c.pick }}\" style=\"min-height:44px;padding:0 14px;border-radius:999px;border:1px solid {{c.bd}};background:{{c.bg}};color:{{c.fg}};font-size:15px;font-weight:500;cursor:pointer\">{{c.label}}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<p style=\"margin:0;font-size:14px;line-height:1.5;color:#4A4F5E\">{{costNote}}<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<sc-for list=\"{{ toggles }}\" as=\"t\" hint-placeholder-count=\"2\">\n<button type=\"button\" aria-pressed=\"{{t.on}}\" sc-camel-on-click=\"{{ t.flip }}\" style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:56px;padding:8px 14px;border-radius:12px;border:1px solid #E3E0D6;background:#FBFAF7;text-align:left;cursor:pointer;color:#1D2230\">\n<span style=\"display:flex;flex-direction:column;gap:2px;min-width:0\"><span style=\"font-size:15px;font-weight:700\">{{t.label}}<\u002Fspan><span style=\"font-size:13px;color:#4A4F5E\">{{t.hint}}<\u002Fspan><\u002Fspan>\n<span style=\"position:relative;flex:none;width:44px;height:26px;border-radius:999px;background:{{t.track}}\"><span style=\"position:absolute;top:3px;left:{{t.knob}};width:20px;height:20px;border-radius:50%;background:#FFFFFF\"><\u002Fspan><\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n\n<button type=\"button\" sc-camel-on-click=\"{{ submitPlan }}\" style=\"min-height:52px;border-radius:14px;border:0;background:{{accent}};color:#FFFFFF;font-size:17px;font-weight:700;cursor:pointer\">Post my plan<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- PLANS FEED -->\n<section id=\"plans\" style=\"max-width:1120px;margin:0 auto;padding:16px 24px 72px;display:flex;flex-direction:column;gap:28px;box-sizing:border-box\">\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<h2 style=\"margin:0;font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;font-weight:800;font-size:38px;letter-spacing:-0.02em\">Plans on your campus<\u002Fh2>\n<p style=\"margin:0;font-size:17px;color:#4A4F5E;max-width:640px\">These plans and people are made up for this preview. Join one, or post your own above and watch it land at the top.<\u002Fp>\n<\u002Fdiv>\n<div role=\"group\" aria-label=\"Filter plans\" style=\"display:flex;flex-wrap:wrap;gap:8px\">\n<sc-for list=\"{{ filters }}\" as=\"c\" hint-placeholder-count=\"8\">\n<button type=\"button\" aria-pressed=\"{{c.on}}\" sc-camel-on-click=\"{{ c.pick }}\" style=\"min-height:44px;padding:0 18px;border-radius:999px;border:1px solid {{c.bd}};background:{{c.bg}};color:{{c.fg}};font-size:15px;font-weight:500;cursor:pointer\">{{c.label}}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n\n<sc-if value=\"{{ noPlans }}\" hint-placeholder-val=\"{{ false }}\">\n<p style=\"margin:0;padding:32px;border-radius:18px;background:#FFFFFF;border:1px dashed #CFCBC0;font-size:17px;color:#4A4F5E\">Nothing here yet. Start the first one above.<\u002Fp>\n<\u002Fsc-if>\n\n<div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px;align-items:start\">\n<sc-for list=\"{{ plans }}\" as=\"item\" hint-placeholder-count=\"6\">\n<article style=\"min-width:0;background:#FFFFFF;border:1px solid #E3E0D6;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box\">\n<div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:6px\">\n<span style=\"padding:5px 12px;border-radius:999px;background:{{item.catBg}};font-size:13px;font-weight:700\">{{item.cat}}<\u002Fspan>\n<sc-if value=\"{{ item.weekly }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"padding:5px 12px;border-radius:999px;background:#EEF0F4;font-size:13px;font-weight:500\">Repeats weekly<\u002Fspan><\u002Fsc-if>\n<sc-if value=\"{{ item.women }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"padding:5px 12px;border-radius:999px;background:#E4F0EB;color:#0A5A4A;font-size:13px;font-weight:700\">Women-only<\u002Fspan><\u002Fsc-if>\n<sc-if value=\"{{ item.approve }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"padding:5px 12px;border-radius:999px;background:#EEF0F4;font-size:13px;font-weight:500\">Host approves<\u002Fspan><\u002Fsc-if>\n<\u002Fdiv>\n<h3 style=\"margin:0;font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;font-weight:700;font-size:22px;line-height:1.2;letter-spacing:-0.01em;text-wrap:balance\">{{item.title}}<\u002Fh3>\n<div style=\"display:flex;flex-direction:column;gap:6px;font-size:15px;color:#3B4050\">\n<div style=\"display:flex;align-items:center;gap:8px\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><circle cx=\"8\" cy=\"8\" r=\"6.2\" stroke=\"#5B6070\" stroke-width=\"1.5\"><\u002Fcircle><path d=\"M8 4.7V8l2.2 1.4\" stroke=\"#5B6070\" stroke-width=\"1.5\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>{{item.when}}<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:8px\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><path d=\"M8 14.2s4.6-3.9 4.6-7.4A4.6 4.6 0 003.4 6.8C3.4 10.3 8 14.2 8 14.2z\" stroke=\"#5B6070\" stroke-width=\"1.5\" stroke-linejoin=\"round\"><\u002Fpath><circle cx=\"8\" cy=\"6.8\" r=\"1.6\" fill=\"#5B6070\"><\u002Fcircle><\u002Fsvg><span>{{item.where}} <span style=\"color:#0A5A4A;font-weight:700\">· public place<\u002Fspan><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:10px;font-size:14px;color:#3B4050\">\n<span style=\"flex:none;width:32px;height:32px;border-radius:50%;background:#EEF0F4;display:inline-flex;align-items:center;justify-content:center;font-weight:700\">{{item.hostIni}}<\u002Fspan>\n<span style=\"min-width:0\">Hosted by <strong>{{item.hostName}}<\u002Fstrong>, {{item.hostDept}}<br><span style=\"color:#0A5A4A;font-weight:700\">Verified student<\u002Fspan> · {{item.hostRating}}<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px\">\n<div style=\"display:flex;align-items:center;padding-right:8px\">\n<sc-for list=\"{{ item.avatars }}\" as=\"a\" hint-placeholder-count=\"3\">\n<span style=\"width:30px;height:30px;margin-right:-8px;border-radius:50%;background:{{a.bg}};border:2px solid #FFFFFF;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;box-sizing:border-box\">{{a.ini}}<\u002Fspan>\n<\u002Fsc-for>\n<\u002Fdiv>\n<span style=\"font-size:14px;font-weight:700;font-variant-numeric:tabular-nums\">{{item.spotsText}}<\u002Fspan>\n<\u002Fdiv>\n<div style=\"height:6px;border-radius:999px;background:#ECEAE3;overflow:hidden\"><div style=\"height:6px;border-radius:999px;background:#0E7561;width:{{item.fillPct}}\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;font-size:15px\">\n<strong>{{item.priceText}}<\u002Fstrong>\n<sc-if value=\"{{ item.hasPrice }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:13px;color:#4A4F5E\">Held until the plan is confirmed<\u002Fspan><\u002Fsc-if>\n<\u002Fdiv>\n<sc-if value=\"{{ item.late }}\" hint-placeholder-val=\"{{ false }}\">\n<p style=\"margin:0;font-size:13px;color:#6B4A00;background:#FFF3D1;border-radius:10px;padding:8px 10px\">Evening plan: this host is phone-verified.<\u002Fp>\n<\u002Fsc-if>\n<button type=\"button\" aria-expanded=\"{{item.open}}\" sc-camel-on-click=\"{{ item.toggleOpen }}\" style=\"align-self:flex-start;min-height:44px;padding:0;border:0;background:transparent;color:#0A5A4A;font-size:15px;font-weight:700;cursor:pointer;text-decoration:underline\">{{item.whoLabel}}<\u002Fbutton>\n<sc-if value=\"{{ item.open }}\" hint-placeholder-val=\"{{ false }}\">\n<ul style=\"margin:0;padding:12px 14px;list-style:none;display:flex;flex-direction:column;gap:8px;background:#FBFAF7;border-radius:12px;font-size:14px\">\n<sc-for list=\"{{ item.going }}\" as=\"g\" hint-placeholder-count=\"3\">\n<li style=\"display:flex;justify-content:space-between;gap:12px\"><span><strong>{{g.n}}<\u002Fstrong> · {{g.d}}<\u002Fspan><span style=\"color:#0A5A4A;font-weight:700\">Verified<\u002Fspan><\u002Fli>\n<\u002Fsc-for>\n<\u002Ful>\n<\u002Fsc-if>\n<button type=\"button\" disabled=\"{{item.full}}\" sc-camel-on-click=\"{{ item.onJoin }}\" style=\"min-height:48px;border-radius:12px;border:1px solid {{item.btnBd}};background:{{item.btnBg}};color:{{item.btnFg}};font-size:16px;font-weight:700;cursor:{{item.cursor}}\">{{item.btnLabel}}<\u002Fbutton>\n<div style=\"display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 12px;font-size:13px;color:#4A4F5E\">\n<span>{{item.joinNote}}<\u002Fspan>\n<sc-if value=\"{{ item.notReported }}\" hint-placeholder-val=\"{{ true }}\">\n<button type=\"button\" sc-camel-on-click=\"{{ item.onReport }}\" style=\"min-height:44px;padding:0 4px;border:0;background:transparent;color:#4A4F5E;font-size:13px;cursor:pointer;text-decoration:underline\">Report this plan<\u002Fbutton>\n<\u002Fsc-if>\n<sc-if value=\"{{ item.reported }}\" hint-placeholder-val=\"{{ false }}\">\n<span style=\"color:#0A5A4A;font-weight:700\">Reported. A person will review it.<\u002Fspan>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Farticle>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- SAFETY -->\n<section id=\"safety\" style=\"background:#E4F0EB\">\n<div style=\"max-width:1120px;margin:0 auto;padding:72px 24px;display:flex;flex-direction:column;gap:32px;box-sizing:border-box\">\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<h2 style=\"margin:0;font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;font-weight:800;font-size:38px;letter-spacing:-0.02em;max-width:720px;text-wrap:balance\">Saying yes to strangers should feel easy<\u002Fh2>\n<p style=\"margin:0;font-size:17px;color:#33423D;max-width:640px\">One bad incident would end a campus app. So safety is part of every screen, from before you join to after you get home.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;align-items:start\">\n<sc-for list=\"{{ safety }}\" as=\"col\" hint-placeholder-count=\"3\">\n<div style=\"min-width:0;background:#FFFFFF;border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:16px;box-sizing:border-box\">\n<h3 style=\"margin:0;font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;font-weight:800;font-size:24px\">{{col.title}}<\u002Fh3>\n<ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;font-size:16px;line-height:1.45\">\n<sc-for list=\"{{ col.items }}\" as=\"it\" hint-placeholder-count=\"5\">\n<li style=\"display:flex;gap:10px;align-items:flex-start\"><svg style=\"flex:none;margin-top:3px\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><circle cx=\"8\" cy=\"8\" r=\"8\" fill=\"#0E7561\"><\u002Fcircle><path d=\"M4.5 8.3l2.2 2.2 4.8-4.8\" stroke=\"#fff\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><span>{{it.t}}<\u002Fspan><\u002Fli>\n<\u002Fsc-for>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- BOOKINGS AND MONEY -->\n<section id=\"money\" style=\"max-width:1120px;margin:0 auto;padding:72px 24px;display:flex;flex-wrap:wrap;gap:48px;align-items:flex-start;box-sizing:border-box\">\n<div style=\"flex:1 1 440px;min-width:0;display:flex;flex-direction:column;gap:24px\">\n<h2 style=\"margin:0;font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;font-weight:800;font-size:38px;letter-spacing:-0.02em;text-wrap:balance\">Booking a turf or a table? Nobody fronts the money.<\u002Fh2>\n<p style=\"margin:0;font-size:17px;line-height:1.55;color:#4A4F5E;max-width:540px\">Hosts shouldn't have to chase friends for UPI. Everyone pays their share inside Chalo, and it stays on hold until the plan is confirmed. Chai, walks and other casual plans stay free, always.<\u002Fp>\n<ol style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:14px\">\n<sc-for list=\"{{ steps }}\" as=\"st\" hint-placeholder-count=\"4\">\n<li style=\"display:flex;gap:14px;align-items:flex-start;font-size:16px;line-height:1.45\">\n<span style=\"flex:none;width:30px;height:30px;border-radius:50%;background:#1D2230;color:#FFFFFF;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:700\">{{st.n}}<\u002Fspan>\n<span style=\"padding-top:4px\">{{st.t}}<\u002Fspan>\n<\u002Fli>\n<\u002Fsc-for>\n<\u002Fol>\n<p style=\"margin:0;font-size:15px;color:#4A4F5E;max-width:540px\">Chalo adds a small fee only when a booking goes through. Hosts who run plans every week get extras later, like better visibility and organiser tools.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"flex:1 1 360px;min-width:0;max-width:480px;background:#FFFFFF;border:1px solid #E3E0D6;border-radius:22px;padding:28px;display:flex;flex-direction:column;gap:20px;box-sizing:border-box\">\n<div style=\"display:flex;flex-direction:column;gap:4px\">\n<h3 style=\"margin:0;font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;font-weight:800;font-size:22px\">Example: a 90-minute turf slot<\u002Fh3>\n<p style=\"margin:0;font-size:14px;color:#4A4F5E\">Sample prices. Try a different group size.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px\">\n<span style=\"font-size:15px;font-weight:500\">People splitting it<\u002Fspan>\n<div style=\"display:flex;align-items:center;gap:12px\">\n<button type=\"button\" aria-label=\"Fewer people\" sc-camel-on-click=\"{{ groupDown }}\" style=\"width:44px;height:44px;border-radius:50%;border:1px solid #CFCBC0;background:#FFFFFF;font-size:22px;color:#1D2230;cursor:pointer\">−<\u002Fbutton>\n<span style=\"min-width:28px;text-align:center;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums\">{{groupSize}}<\u002Fspan>\n<button type=\"button\" aria-label=\"More people\" sc-camel-on-click=\"{{ groupUp }}\" style=\"width:44px;height:44px;border-radius:50%;border:1px solid #CFCBC0;background:#FFFFFF;font-size:22px;color:#1D2230;cursor:pointer\">+<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<dl style=\"margin:0;display:flex;flex-direction:column;gap:12px;font-size:16px;font-variant-numeric:tabular-nums\">\n<div style=\"display:flex;justify-content:space-between;gap:12px\"><dt>Turf booking<\u002Fdt><dd style=\"margin:0\">{{total}}<\u002Fdd><\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;gap:12px\"><dt>Your share<\u002Fdt><dd style=\"margin:0\">{{share}}<\u002Fdd><\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;gap:12px\"><dt>Chalo fee (example: 5%)<\u002Fdt><dd style=\"margin:0\">{{fee}}<\u002Fdd><\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;gap:12px;padding-top:12px;border-top:1px solid #E3E0D6;font-size:20px;font-weight:800\"><dt>You pay<\u002Fdt><dd style=\"margin:0\">{{pay}}<\u002Fdd><\u002Fdiv>\n<\u002Fdl>\n<p style=\"margin:0;font-size:14px;line-height:1.5;color:#0A5A4A;background:#E4F0EB;border-radius:10px;padding:10px 12px\">The host pays nothing up front. If fewer people pay than needed, the plan doesn't go ahead and everyone is refunded.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- HABIT -->\n<section style=\"background:#FFFFFF;border-top:1px solid #E3E0D6;border-bottom:1px solid #E3E0D6\">\n<div style=\"max-width:1120px;margin:0 auto;padding:72px 24px;display:flex;flex-direction:column;gap:32px;box-sizing:border-box\">\n<h2 style=\"margin:0;font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;font-weight:800;font-size:38px;letter-spacing:-0.02em;max-width:720px;text-wrap:balance\">So it doesn't stop at one chai<\u002Fh2>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;align-items:start\">\n<div style=\"min-width:0;background:#F6F5F1;border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:12px\">\n<h3 style=\"margin:0;font-size:20px;font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;font-weight:800\">Repeat any plan<\u002Fh3>\n<p style=\"margin:0;font-size:16px;line-height:1.5;color:#3B4050\">Turn a good Saturday into a weekly one. Regulars get a reminder, new people can slot in.<\u002Fp>\n<span style=\"align-self:flex-start;padding:8px 14px;border-radius:999px;background:#CDEBD8;font-size:14px;font-weight:700\">Football · every Saturday, 6 AM<\u002Fspan>\n<\u002Fdiv>\n<div style=\"min-width:0;background:#F6F5F1;border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:12px\">\n<h3 style=\"margin:0;font-size:20px;font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;font-weight:800\">Follow what you like<\u002Fh3>\n<p style=\"margin:0;font-size:16px;line-height:1.5;color:#3B4050\">Pick a few interests and the feed leads with plans that fit, from people outside your usual circle.<\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n<span style=\"padding:8px 14px;border-radius:999px;background:#DCD4F7;font-size:14px;font-weight:700\">Gaming<\u002Fspan>\n<span style=\"padding:8px 14px;border-radius:999px;background:#CFE5F5;font-size:14px;font-weight:700\">Trails and walks<\u002Fspan>\n<span style=\"padding:8px 14px;border-radius:999px;background:#FFE3B8;font-size:14px;font-weight:700\">Chai<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"min-width:0;background:#F6F5F1;border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:12px\">\n<h3 style=\"margin:0;font-size:20px;font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;font-weight:800\">People you've met<\u002Fh3>\n<p style=\"margin:0;font-size:16px;line-height:1.5;color:#3B4050\">After a plan, the people you enjoyed stay in one list. Invite them to the next one in a tap.<\u002Fp>\n<div style=\"display:flex;align-items:center;padding-right:8px\">\n<span style=\"width:36px;height:36px;margin-right:-8px;border-radius:50%;background:#FFD9C9;border:2px solid #F6F5F1;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;box-sizing:border-box\">A<\u002Fspan>\n<span style=\"width:36px;height:36px;margin-right:-8px;border-radius:50%;background:#D6ECE4;border:2px solid #F6F5F1;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;box-sizing:border-box\">V<\u002Fspan>\n<span style=\"width:36px;height:36px;margin-right:-8px;border-radius:50%;background:#E3DCFA;border:2px solid #F6F5F1;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;box-sizing:border-box\">S<\u002Fspan>\n<span style=\"width:36px;height:36px;margin-right:-8px;border-radius:50%;background:#FFF0B8;border:2px solid #F6F5F1;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;box-sizing:border-box\">K<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- LAUNCH + VENUES -->\n<section id=\"launch\" style=\"max-width:1120px;margin:0 auto;padding:72px 24px;display:flex;flex-wrap:wrap;gap:48px;align-items:flex-start;box-sizing:border-box\">\n<div style=\"flex:1 1 440px;min-width:0;display:flex;flex-direction:column;gap:20px\">\n<h2 style=\"margin:0;font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;font-weight:800;font-size:38px;letter-spacing:-0.02em;text-wrap:balance\">Opening one campus at a time<\u002Fh2>\n<p style=\"margin:0;font-size:17px;line-height:1.55;color:#4A4F5E;max-width:540px\">A feed with three plans feels empty. So we start at one hostel-heavy campus, and our own hosts post the first 30 to 50 plans before anyone else arrives. Want Chalo at your college? Join the list with your college email.<\u002Fp>\n<div style=\"display:flex;flex-direction:column;gap:8px;max-width:480px\">\n<label for=\"wait-email\" style=\"font-size:13px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:#4A4F5E\">College email<\u002Flabel>\n<div style=\"display:flex;flex-wrap:wrap;gap:10px\">\n<input id=\"wait-email\" type=\"email\" value=\"{{ email }}\" sc-camel-on-input=\"{{ onEmail }}\" placeholder=\"you@yourcollege.edu\" style=\"flex:1 1 220px;min-width:0;min-height:52px;border-radius:12px;border:1px solid #CFCBC0;padding:0 14px;font-size:16px;color:#1D2230;background:#FFFFFF;box-sizing:border-box\">\n<button type=\"button\" sc-camel-on-click=\"{{ joinList }}\" style=\"min-height:52px;padding:0 24px;border-radius:12px;border:0;background:{{accent}};color:#FFFFFF;font-size:16px;font-weight:700;cursor:pointer\">Join the list<\u002Fbutton>\n<\u002Fdiv>\n<sc-if value=\"{{ hasWaitError }}\" hint-placeholder-val=\"{{ false }}\"><p role=\"alert\" style=\"margin:0;font-size:14px;color:#B3261E;font-weight:500\">{{waitError}}<\u002Fp><\u002Fsc-if>\n<sc-if value=\"{{ waitDone }}\" hint-placeholder-val=\"{{ false }}\"><p role=\"status\" style=\"margin:0;font-size:15px;color:#0A5A4A;font-weight:700\">You're on the list. We'll write when your campus opens.<\u002Fp><\u002Fsc-if>\n<p style=\"margin:0;font-size:13px;color:#4A4F5E\">Sample form. Nothing is saved in this preview.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1 1 360px;min-width:0;max-width:480px;background:#1D2230;color:#FFFFFF;border-radius:22px;padding:28px;display:flex;flex-direction:column;gap:16px;box-sizing:border-box\">\n<h3 style=\"margin:0;font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;font-weight:800;font-size:26px;line-height:1.15\">Run a café, turf or gaming zone near campus?<\u002Fh3>\n<p style=\"margin:0;font-size:16px;line-height:1.5;color:#D5D8E0\">Fill your quiet hours with groups of students who arrive together and book in one go.<\u002Fp>\n<ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;font-size:16px\">\n<li style=\"display:flex;gap:10px;align-items:flex-start\"><svg style=\"flex:none;margin-top:3px\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><circle cx=\"8\" cy=\"8\" r=\"8\" fill=\"#FFE08A\"><\u002Fcircle><path d=\"M4.5 8.3l2.2 2.2 4.8-4.8\" stroke=\"#1D2230\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>Groups book and pay through one host-free split<\u002Fli>\n<li style=\"display:flex;gap:10px;align-items:flex-start\"><svg style=\"flex:none;margin-top:3px\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><circle cx=\"8\" cy=\"8\" r=\"8\" fill=\"#FFE08A\"><\u002Fcircle><path d=\"M4.5 8.3l2.2 2.2 4.8-4.8\" stroke=\"#1D2230\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>Student offers appear right on plans at your venue<\u002Fli>\n<\u002Ful>\n<p style=\"margin:0;font-size:14px;color:#D5D8E0\">Venue partnerships open once the first campus is live.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- FOOTER -->\n<footer style=\"border-top:1px solid #E3E0D6\">\n<div style=\"max-width:1120px;margin:0 auto;padding:32px 24px 40px;display:flex;flex-wrap:wrap;gap:16px 32px;justify-content:space-between;align-items:center;font-size:14px;color:#4A4F5E;box-sizing:border-box\">\n<span>Chalo Campus · for college students aged 18 and over · sample preview<\u002Fspan>\n<nav style=\"display:flex;flex-wrap:wrap;gap:4px 20px\">\n<a href=\"#safety\" style=\"display:inline-flex;align-items:center;min-height:44px\">Community rules<\u002Fa>\n<a href=\"#safety\" style=\"display:inline-flex;align-items:center;min-height:44px\">Report a problem<\u002Fa>\n<a href=\"#safety\" style=\"display:inline-flex;align-items:center;min-height:44px\">Privacy<\u002Fa>\n<a href=\"#safety\" style=\"display:inline-flex;align-items:center;min-height:44px\">Grievance officer<\u002Fa>\n<\u002Fnav>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<sc-if value=\"{{ hasToast }}\" hint-placeholder-val=\"{{ false }}\">\n<div role=\"status\" style=\"position:fixed;left:0;right:0;bottom:24px;display:flex;justify-content:center;padding:0 16px;pointer-events:none\">\n<div style=\"background:#1D2230;color:#FFFFFF;padding:14px 20px;border-radius:14px;font-size:15px;max-width:480px;box-shadow:0 8px 24px rgba(29,34,48,0.25)\">{{toast}}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<sc-if data-dc-static=\"\" value=\"{{ false }}\"><style>x-dc>*{display:none!important}x-dc>[data-dc-static]{display:block!important}<\u002Fstyle>\n\n\n<div style=\"min-height:100%;background:#F6F5F1;font-family:'DM Sans',system-ui,sans-serif;color:#1D2230\" data-canvas-width=\"1280\" data-canvas-height=\"4300\" data-document-role=\"page\" data-label=\"Chalo Campus\">\n\n\n<header style=\"max-width:1120px;margin:0 auto;padding:20px 24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;box-sizing:border-box\">\n<div style=\"display:flex;align-items:center;gap:10px\">\n<svg width=\"36\" height=\"30\" viewBox=\"0 0 36 30\" fill=\"none\" aria-hidden=\"true\"><circle cx=\"13\" cy=\"15\" r=\"12\" fill=\"#D2452B\"><\u002Fcircle><circle cx=\"23\" cy=\"15\" r=\"12\" fill=\"#0E7561\" fill-opacity=\"0.85\"><\u002Fcircle><\u002Fsvg>\n<span style=\"font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;font-weight:800;font-size:26px;letter-spacing:-0.02em\">chalo<\u002Fspan>\n<\u002Fdiv>\n<nav style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;font-size:16px;font-weight:500\">\n<a href=\"#plans\" style=\"color:#1D2230;text-decoration:none;padding:10px 0\">Plans<\u002Fa>\n<a href=\"#safety\" style=\"color:#1D2230;text-decoration:none;padding:10px 0\">Safety<\u002Fa>\n<a href=\"#money\" style=\"color:#1D2230;text-decoration:none;padding:10px 0\">Bookings<\u002Fa>\n<a href=\"#launch\" style=\"display:inline-flex;align-items:center;min-height:44px;padding:0 20px;border-radius:999px;background:#1D2230;color:#FFFFFF;text-decoration:none;font-weight:700\">Get on the list<\u002Fa>\n<\u002Fnav>\n<\u002Fheader>\n\n\n<section style=\"max-width:1120px;margin:0 auto;padding:32px 24px 64px;display:flex;flex-wrap:wrap;gap:48px;align-items:flex-start;box-sizing:border-box\">\n<div style=\"flex:1 1 440px;min-width:0;display:flex;flex-direction:column;gap:24px;padding-top:16px\">\n<div style=\"align-self:flex-start;display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:#FFFFFF;border:1px solid #E3E0D6;font-size:14px;font-weight:500\">\n<svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><circle cx=\"8\" cy=\"8\" r=\"8\" fill=\"#0E7561\"><\u002Fcircle><path d=\"M4.5 8.3l2.2 2.2 4.8-4.8\" stroke=\"#fff\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\nSample College, Bengaluru · students only\n<\u002Fdiv>\n<h1 style=\"margin:0;font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;font-weight:800;font-size:clamp(40px,6vw,64px);line-height:1.04;letter-spacing:-0.025em;text-wrap:balance\">Going out? Don't go <span style=\"background:#FFE08A;padding:0 10px;border-radius:10px\">alone.<\u002Fspan><\u002Fh1>\n<p style=\"margin:0;font-size:19px;line-height:1.55;color:#4A4F5E;max-width:520px\">Post a plan and find people from your college who'd come along. Chai, football, a café, a movie, a walk. It doesn't have to be an official event.<\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;gap:12px;align-items:center\">\n<a href=\"#plans\" style=\"display:inline-flex;align-items:center;min-height:52px;padding:0 28px;border-radius:14px;background:#D2452B;color:#FFFFFF;font-weight:700;font-size:17px;text-decoration:none\">Find a plan<\u002Fa>\n<a href=\"#safety\" style=\"display:inline-flex;align-items:center;min-height:52px;padding:0 20px;font-weight:700;font-size:17px;color:#1D2230\">How we keep it safe<\u002Fa>\n<\u002Fdiv>\n<ul style=\"margin:8px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:10px 22px;font-size:15px;color:#4A4F5E\">\n\n<li style=\"display:flex;align-items:center;gap:8px\">\n<svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><circle cx=\"8\" cy=\"8\" r=\"8\" fill=\"#0E7561\"><\u002Fcircle><path d=\"M4.5 8.3l2.2 2.2 4.8-4.8\" stroke=\"#fff\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n{{t.text}}\n<\u002Fli>\n\n<\u002Ful>\n<\u002Fdiv>\n\n\n<div style=\"flex:1 1 400px;min-width:0;max-width:520px;background:#FFFFFF;border:1px solid #E3E0D6;border-radius:22px;padding:28px;display:flex;flex-direction:column;gap:20px;box-shadow:0 12px 36px rgba(29,34,48,0.08);box-sizing:border-box\">\n<div style=\"display:flex;flex-direction:column;gap:4px\">\n<h2 style=\"margin:0;font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;font-weight:800;font-size:26px;letter-spacing:-0.01em\">Start a plan<\u002Fh2>\n<p style=\"margin:0;font-size:15px;color:#4A4F5E\">20 seconds. Only students from your college see it.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<label for=\"plan-title\" style=\"font-size:13px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:#4A4F5E\">What's the plan?<\u002Flabel>\n<input id=\"plan-title\" type=\"text\" placeholder=\"Chai at 5? Anyone free?\" style=\"min-height:48px;border-radius:12px;border:1px solid #CFCBC0;padding:0 14px;font-size:16px;color:#1D2230;background:#FFFFFF;box-sizing:border-box;width:100%\">\n\n<p role=\"alert\" style=\"margin:0;font-size:14px;color:#B3261E;font-weight:500\">{{formError}}<\u002Fp>\n\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<span style=\"font-size:13px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:#4A4F5E\">Type<\u002Fspan>\n<div role=\"group\" aria-label=\"Plan type\" style=\"display:flex;flex-wrap:wrap;gap:8px\">\n\n<button type=\"button\" style=\"min-height:44px;padding:0 16px;border-radius:999px;border:1px solid ;background:;color:;font-size:15px;font-weight:500;cursor:pointer\">{{c.label}}<\u002Fbutton>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<span style=\"font-size:13px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:#4A4F5E\">When<\u002Fspan>\n<div role=\"group\" aria-label=\"Plan time\" style=\"display:flex;flex-wrap:wrap;gap:8px\">\n\n<button type=\"button\" style=\"min-height:44px;padding:0 16px;border-radius:999px;border:1px solid ;background:;color:;font-size:15px;font-weight:500;cursor:pointer\">{{c.label}}<\u002Fbutton>\n\n<\u002Fdiv>\n\n<p style=\"margin:0;font-size:14px;line-height:1.5;color:#6B4A00;background:#FFF3D1;border-radius:10px;padding:10px 12px\">Plans after 8 PM need a verified host. We'll ask you to confirm your phone number before this goes live.<\u002Fp>\n\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<span style=\"font-size:13px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:#4A4F5E\">Where (public places only)<\u002Fspan>\n<div role=\"group\" aria-label=\"Venue\" style=\"display:flex;flex-wrap:wrap;gap:8px\">\n\n<button type=\"button\" style=\"min-height:44px;padding:0 16px;border-radius:999px;border:1px solid ;background:;color:;font-size:15px;font-weight:500;cursor:pointer\">{{c.label}}<\u002Fbutton>\n\n<\u002Fdiv>\n<p style=\"margin:0;font-size:14px;color:#4A4F5E\">You pick from a list of public venues. No private addresses.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-wrap:wrap;gap:20px 32px\">\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<span style=\"font-size:13px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:#4A4F5E\">People who can join<\u002Fspan>\n<div style=\"display:flex;align-items:center;gap:12px\">\n<button type=\"button\" aria-label=\"Fewer spots\" style=\"width:44px;height:44px;border-radius:50%;border:1px solid #CFCBC0;background:#FFFFFF;font-size:22px;color:#1D2230;cursor:pointer\">−<\u002Fbutton>\n<span style=\"min-width:28px;text-align:center;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums\">{{form.spots}}<\u002Fspan>\n<button type=\"button\" aria-label=\"More spots\" style=\"width:44px;height:44px;border-radius:50%;border:1px solid #CFCBC0;background:#FFFFFF;font-size:22px;color:#1D2230;cursor:pointer\">+<\u002Fbutton>\n<\u002Fdiv>\n<p style=\"margin:0;font-size:14px;color:#4A4F5E\">{{groupNote}}<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px;flex:1 1 200px;min-width:0\">\n<span style=\"font-size:13px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:#4A4F5E\">Cost per person<\u002Fspan>\n<div role=\"group\" aria-label=\"Cost per person\" style=\"display:flex;flex-wrap:wrap;gap:8px\">\n\n<button type=\"button\" style=\"min-height:44px;padding:0 14px;border-radius:999px;border:1px solid ;background:;color:;font-size:15px;font-weight:500;cursor:pointer\">{{c.label}}<\u002Fbutton>\n\n<\u002Fdiv>\n<p style=\"margin:0;font-size:14px;line-height:1.5;color:#4A4F5E\">{{costNote}}<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n\n<button type=\"button\" style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:56px;padding:8px 14px;border-radius:12px;border:1px solid #E3E0D6;background:#FBFAF7;text-align:left;cursor:pointer;color:#1D2230\">\n<span style=\"display:flex;flex-direction:column;gap:2px;min-width:0\"><span style=\"font-size:15px;font-weight:700\">{{t.label}}<\u002Fspan><span style=\"font-size:13px;color:#4A4F5E\">{{t.hint}}<\u002Fspan><\u002Fspan>\n<span style=\"position:relative;flex:none;width:44px;height:26px;border-radius:999px;background:\"><span style=\"position:absolute;top:3px;left:;width:20px;height:20px;border-radius:50%;background:#FFFFFF\"><\u002Fspan><\u002Fspan>\n<\u002Fbutton>\n\n<\u002Fdiv>\n\n<button type=\"button\" style=\"min-height:52px;border-radius:14px;border:0;background:#D2452B;color:#FFFFFF;font-size:17px;font-weight:700;cursor:pointer\">Post my plan<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section id=\"plans\" style=\"max-width:1120px;margin:0 auto;padding:16px 24px 72px;display:flex;flex-direction:column;gap:28px;box-sizing:border-box\">\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<h2 style=\"margin:0;font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;font-weight:800;font-size:38px;letter-spacing:-0.02em\">Plans on your campus<\u002Fh2>\n<p style=\"margin:0;font-size:17px;color:#4A4F5E;max-width:640px\">These plans and people are made up for this preview. Join one, or post your own above and watch it land at the top.<\u002Fp>\n<\u002Fdiv>\n<div role=\"group\" aria-label=\"Filter plans\" style=\"display:flex;flex-wrap:wrap;gap:8px\">\n\n<button type=\"button\" style=\"min-height:44px;padding:0 18px;border-radius:999px;border:1px solid ;background:;color:;font-size:15px;font-weight:500;cursor:pointer\">{{c.label}}<\u002Fbutton>\n\n<\u002Fdiv>\n\n\n<p style=\"margin:0;padding:32px;border-radius:18px;background:#FFFFFF;border:1px dashed #CFCBC0;font-size:17px;color:#4A4F5E\">Nothing here yet. Start the first one above.<\u002Fp>\n\n\n<div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px;align-items:start\">\n\n<article style=\"min-width:0;background:#FFFFFF;border:1px solid #E3E0D6;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box\">\n<div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:6px\">\n<span style=\"padding:5px 12px;border-radius:999px;background:;font-size:13px;font-weight:700\">{{item.cat}}<\u002Fspan>\n<span style=\"padding:5px 12px;border-radius:999px;background:#EEF0F4;font-size:13px;font-weight:500\">Repeats weekly<\u002Fspan>\n<span style=\"padding:5px 12px;border-radius:999px;background:#E4F0EB;color:#0A5A4A;font-size:13px;font-weight:700\">Women-only<\u002Fspan>\n<span style=\"padding:5px 12px;border-radius:999px;background:#EEF0F4;font-size:13px;font-weight:500\">Host approves<\u002Fspan>\n<\u002Fdiv>\n<h3 style=\"margin:0;font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;font-weight:700;font-size:22px;line-height:1.2;letter-spacing:-0.01em;text-wrap:balance\">{{item.title}}<\u002Fh3>\n<div style=\"display:flex;flex-direction:column;gap:6px;font-size:15px;color:#3B4050\">\n<div style=\"display:flex;align-items:center;gap:8px\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><circle cx=\"8\" cy=\"8\" r=\"6.2\" stroke=\"#5B6070\" stroke-width=\"1.5\"><\u002Fcircle><path d=\"M8 4.7V8l2.2 1.4\" stroke=\"#5B6070\" stroke-width=\"1.5\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>{{item.when}}<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:8px\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><path d=\"M8 14.2s4.6-3.9 4.6-7.4A4.6 4.6 0 003.4 6.8C3.4 10.3 8 14.2 8 14.2z\" stroke=\"#5B6070\" stroke-width=\"1.5\" stroke-linejoin=\"round\"><\u002Fpath><circle cx=\"8\" cy=\"6.8\" r=\"1.6\" fill=\"#5B6070\"><\u002Fcircle><\u002Fsvg><span>{{item.where}} <span style=\"color:#0A5A4A;font-weight:700\">· public place<\u002Fspan><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:10px;font-size:14px;color:#3B4050\">\n<span style=\"flex:none;width:32px;height:32px;border-radius:50%;background:#EEF0F4;display:inline-flex;align-items:center;justify-content:center;font-weight:700\">{{item.hostIni}}<\u002Fspan>\n<span style=\"min-width:0\">Hosted by <strong>{{item.hostName}}<\u002Fstrong>, {{item.hostDept}}<br><span style=\"color:#0A5A4A;font-weight:700\">Verified student<\u002Fspan> · {{item.hostRating}}<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px\">\n<div style=\"display:flex;align-items:center;padding-right:8px\">\n\n<span style=\"width:30px;height:30px;margin-right:-8px;border-radius:50%;background:;border:2px solid #FFFFFF;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;box-sizing:border-box\">{{a.ini}}<\u002Fspan>\n\n<\u002Fdiv>\n<span style=\"font-size:14px;font-weight:700;font-variant-numeric:tabular-nums\">{{item.spotsText}}<\u002Fspan>\n<\u002Fdiv>\n<div style=\"height:6px;border-radius:999px;background:#ECEAE3;overflow:hidden\"><div style=\"height:6px;border-radius:999px;background:#0E7561;width:\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;font-size:15px\">\n<strong>{{item.priceText}}<\u002Fstrong>\n<span style=\"font-size:13px;color:#4A4F5E\">Held until the plan is confirmed<\u002Fspan>\n<\u002Fdiv>\n\n<p style=\"margin:0;font-size:13px;color:#6B4A00;background:#FFF3D1;border-radius:10px;padding:8px 10px\">Evening plan: this host is phone-verified.<\u002Fp>\n\n<button type=\"button\" style=\"align-self:flex-start;min-height:44px;padding:0;border:0;background:transparent;color:#0A5A4A;font-size:15px;font-weight:700;cursor:pointer;text-decoration:underline\">{{item.whoLabel}}<\u002Fbutton>\n\n<ul style=\"margin:0;padding:12px 14px;list-style:none;display:flex;flex-direction:column;gap:8px;background:#FBFAF7;border-radius:12px;font-size:14px\">\n\n<li style=\"display:flex;justify-content:space-between;gap:12px\"><span><strong>{{g.n}}<\u002Fstrong> · {{g.d}}<\u002Fspan><span style=\"color:#0A5A4A;font-weight:700\">Verified<\u002Fspan><\u002Fli>\n\n<\u002Ful>\n\n<button type=\"button\" style=\"min-height:48px;border-radius:12px;border:1px solid ;background:;color:;font-size:16px;font-weight:700;cursor:\">{{item.btnLabel}}<\u002Fbutton>\n<div style=\"display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 12px;font-size:13px;color:#4A4F5E\">\n<span>{{item.joinNote}}<\u002Fspan>\n\n<button type=\"button\" style=\"min-height:44px;padding:0 4px;border:0;background:transparent;color:#4A4F5E;font-size:13px;cursor:pointer;text-decoration:underline\">Report this plan<\u002Fbutton>\n\n\n<span style=\"color:#0A5A4A;font-weight:700\">Reported. A person will review it.<\u002Fspan>\n\n<\u002Fdiv>\n<\u002Farticle>\n\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section id=\"safety\" style=\"background:#E4F0EB\">\n<div style=\"max-width:1120px;margin:0 auto;padding:72px 24px;display:flex;flex-direction:column;gap:32px;box-sizing:border-box\">\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<h2 style=\"margin:0;font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;font-weight:800;font-size:38px;letter-spacing:-0.02em;max-width:720px;text-wrap:balance\">Saying yes to strangers should feel easy<\u002Fh2>\n<p style=\"margin:0;font-size:17px;color:#33423D;max-width:640px\">One bad incident would end a campus app. So safety is part of every screen, from before you join to after you get home.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;align-items:start\">\n\n<div style=\"min-width:0;background:#FFFFFF;border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:16px;box-sizing:border-box\">\n<h3 style=\"margin:0;font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;font-weight:800;font-size:24px\">{{col.title}}<\u002Fh3>\n<ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;font-size:16px;line-height:1.45\">\n\n<li style=\"display:flex;gap:10px;align-items:flex-start\"><svg style=\"flex:none;margin-top:3px\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><circle cx=\"8\" cy=\"8\" r=\"8\" fill=\"#0E7561\"><\u002Fcircle><path d=\"M4.5 8.3l2.2 2.2 4.8-4.8\" stroke=\"#fff\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><span>{{it.t}}<\u002Fspan><\u002Fli>\n\n<\u002Ful>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section id=\"money\" style=\"max-width:1120px;margin:0 auto;padding:72px 24px;display:flex;flex-wrap:wrap;gap:48px;align-items:flex-start;box-sizing:border-box\">\n<div style=\"flex:1 1 440px;min-width:0;display:flex;flex-direction:column;gap:24px\">\n<h2 style=\"margin:0;font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;font-weight:800;font-size:38px;letter-spacing:-0.02em;text-wrap:balance\">Booking a turf or a table? Nobody fronts the money.<\u002Fh2>\n<p style=\"margin:0;font-size:17px;line-height:1.55;color:#4A4F5E;max-width:540px\">Hosts shouldn't have to chase friends for UPI. Everyone pays their share inside Chalo, and it stays on hold until the plan is confirmed. Chai, walks and other casual plans stay free, always.<\u002Fp>\n<ol style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:14px\">\n\n<li style=\"display:flex;gap:14px;align-items:flex-start;font-size:16px;line-height:1.45\">\n<span style=\"flex:none;width:30px;height:30px;border-radius:50%;background:#1D2230;color:#FFFFFF;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:700\">{{st.n}}<\u002Fspan>\n<span style=\"padding-top:4px\">{{st.t}}<\u002Fspan>\n<\u002Fli>\n\n<\u002Fol>\n<p style=\"margin:0;font-size:15px;color:#4A4F5E;max-width:540px\">Chalo adds a small fee only when a booking goes through. Hosts who run plans every week get extras later, like better visibility and organiser tools.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"flex:1 1 360px;min-width:0;max-width:480px;background:#FFFFFF;border:1px solid #E3E0D6;border-radius:22px;padding:28px;display:flex;flex-direction:column;gap:20px;box-sizing:border-box\">\n<div style=\"display:flex;flex-direction:column;gap:4px\">\n<h3 style=\"margin:0;font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;font-weight:800;font-size:22px\">Example: a 90-minute turf slot<\u002Fh3>\n<p style=\"margin:0;font-size:14px;color:#4A4F5E\">Sample prices. Try a different group size.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px\">\n<span style=\"font-size:15px;font-weight:500\">People splitting it<\u002Fspan>\n<div style=\"display:flex;align-items:center;gap:12px\">\n<button type=\"button\" aria-label=\"Fewer people\" style=\"width:44px;height:44px;border-radius:50%;border:1px solid #CFCBC0;background:#FFFFFF;font-size:22px;color:#1D2230;cursor:pointer\">−<\u002Fbutton>\n<span style=\"min-width:28px;text-align:center;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums\">{{groupSize}}<\u002Fspan>\n<button type=\"button\" aria-label=\"More people\" style=\"width:44px;height:44px;border-radius:50%;border:1px solid #CFCBC0;background:#FFFFFF;font-size:22px;color:#1D2230;cursor:pointer\">+<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<dl style=\"margin:0;display:flex;flex-direction:column;gap:12px;font-size:16px;font-variant-numeric:tabular-nums\">\n<div style=\"display:flex;justify-content:space-between;gap:12px\"><dt>Turf booking<\u002Fdt><dd style=\"margin:0\">{{total}}<\u002Fdd><\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;gap:12px\"><dt>Your share<\u002Fdt><dd style=\"margin:0\">{{share}}<\u002Fdd><\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;gap:12px\"><dt>Chalo fee (example: 5%)<\u002Fdt><dd style=\"margin:0\">{{fee}}<\u002Fdd><\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;gap:12px;padding-top:12px;border-top:1px solid #E3E0D6;font-size:20px;font-weight:800\"><dt>You pay<\u002Fdt><dd style=\"margin:0\">{{pay}}<\u002Fdd><\u002Fdiv>\n<\u002Fdl>\n<p style=\"margin:0;font-size:14px;line-height:1.5;color:#0A5A4A;background:#E4F0EB;border-radius:10px;padding:10px 12px\">The host pays nothing up front. If fewer people pay than needed, the plan doesn't go ahead and everyone is refunded.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section style=\"background:#FFFFFF;border-top:1px solid #E3E0D6;border-bottom:1px solid #E3E0D6\">\n<div style=\"max-width:1120px;margin:0 auto;padding:72px 24px;display:flex;flex-direction:column;gap:32px;box-sizing:border-box\">\n<h2 style=\"margin:0;font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;font-weight:800;font-size:38px;letter-spacing:-0.02em;max-width:720px;text-wrap:balance\">So it doesn't stop at one chai<\u002Fh2>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;align-items:start\">\n<div style=\"min-width:0;background:#F6F5F1;border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:12px\">\n<h3 style=\"margin:0;font-size:20px;font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;font-weight:800\">Repeat any plan<\u002Fh3>\n<p style=\"margin:0;font-size:16px;line-height:1.5;color:#3B4050\">Turn a good Saturday into a weekly one. Regulars get a reminder, new people can slot in.<\u002Fp>\n<span style=\"align-self:flex-start;padding:8px 14px;border-radius:999px;background:#CDEBD8;font-size:14px;font-weight:700\">Football · every Saturday, 6 AM<\u002Fspan>\n<\u002Fdiv>\n<div style=\"min-width:0;background:#F6F5F1;border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:12px\">\n<h3 style=\"margin:0;font-size:20px;font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;font-weight:800\">Follow what you like<\u002Fh3>\n<p style=\"margin:0;font-size:16px;line-height:1.5;color:#3B4050\">Pick a few interests and the feed leads with plans that fit, from people outside your usual circle.<\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n<span style=\"padding:8px 14px;border-radius:999px;background:#DCD4F7;font-size:14px;font-weight:700\">Gaming<\u002Fspan>\n<span style=\"padding:8px 14px;border-radius:999px;background:#CFE5F5;font-size:14px;font-weight:700\">Trails and walks<\u002Fspan>\n<span style=\"padding:8px 14px;border-radius:999px;background:#FFE3B8;font-size:14px;font-weight:700\">Chai<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"min-width:0;background:#F6F5F1;border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:12px\">\n<h3 style=\"margin:0;font-size:20px;font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;font-weight:800\">People you've met<\u002Fh3>\n<p style=\"margin:0;font-size:16px;line-height:1.5;color:#3B4050\">After a plan, the people you enjoyed stay in one list. Invite them to the next one in a tap.<\u002Fp>\n<div style=\"display:flex;align-items:center;padding-right:8px\">\n<span style=\"width:36px;height:36px;margin-right:-8px;border-radius:50%;background:#FFD9C9;border:2px solid #F6F5F1;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;box-sizing:border-box\">A<\u002Fspan>\n<span style=\"width:36px;height:36px;margin-right:-8px;border-radius:50%;background:#D6ECE4;border:2px solid #F6F5F1;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;box-sizing:border-box\">V<\u002Fspan>\n<span style=\"width:36px;height:36px;margin-right:-8px;border-radius:50%;background:#E3DCFA;border:2px solid #F6F5F1;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;box-sizing:border-box\">S<\u002Fspan>\n<span style=\"width:36px;height:36px;margin-right:-8px;border-radius:50%;background:#FFF0B8;border:2px solid #F6F5F1;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;box-sizing:border-box\">K<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section id=\"launch\" style=\"max-width:1120px;margin:0 auto;padding:72px 24px;display:flex;flex-wrap:wrap;gap:48px;align-items:flex-start;box-sizing:border-box\">\n<div style=\"flex:1 1 440px;min-width:0;display:flex;flex-direction:column;gap:20px\">\n<h2 style=\"margin:0;font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;font-weight:800;font-size:38px;letter-spacing:-0.02em;text-wrap:balance\">Opening one campus at a time<\u002Fh2>\n<p style=\"margin:0;font-size:17px;line-height:1.55;color:#4A4F5E;max-width:540px\">A feed with three plans feels empty. So we start at one hostel-heavy campus, and our own hosts post the first 30 to 50 plans before anyone else arrives. Want Chalo at your college? Join the list with your college email.<\u002Fp>\n<div style=\"display:flex;flex-direction:column;gap:8px;max-width:480px\">\n<label for=\"wait-email\" style=\"font-size:13px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:#4A4F5E\">College email<\u002Flabel>\n<div style=\"display:flex;flex-wrap:wrap;gap:10px\">\n<input id=\"wait-email\" type=\"email\" placeholder=\"you@yourcollege.edu\" style=\"flex:1 1 220px;min-width:0;min-height:52px;border-radius:12px;border:1px solid #CFCBC0;padding:0 14px;font-size:16px;color:#1D2230;background:#FFFFFF;box-sizing:border-box\">\n<button type=\"button\" style=\"min-height:52px;padding:0 24px;border-radius:12px;border:0;background:#D2452B;color:#FFFFFF;font-size:16px;font-weight:700;cursor:pointer\">Join the list<\u002Fbutton>\n<\u002Fdiv>\n<p role=\"alert\" style=\"margin:0;font-size:14px;color:#B3261E;font-weight:500\">{{waitError}}<\u002Fp>\n<p role=\"status\" style=\"margin:0;font-size:15px;color:#0A5A4A;font-weight:700\">You're on the list. We'll write when your campus opens.<\u002Fp>\n<p style=\"margin:0;font-size:13px;color:#4A4F5E\">Sample form. Nothing is saved in this preview.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1 1 360px;min-width:0;max-width:480px;background:#1D2230;color:#FFFFFF;border-radius:22px;padding:28px;display:flex;flex-direction:column;gap:16px;box-sizing:border-box\">\n<h3 style=\"margin:0;font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;font-weight:800;font-size:26px;line-height:1.15\">Run a café, turf or gaming zone near campus?<\u002Fh3>\n<p style=\"margin:0;font-size:16px;line-height:1.5;color:#D5D8E0\">Fill your quiet hours with groups of students who arrive together and book in one go.<\u002Fp>\n<ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;font-size:16px\">\n<li style=\"display:flex;gap:10px;align-items:flex-start\"><svg style=\"flex:none;margin-top:3px\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><circle cx=\"8\" cy=\"8\" r=\"8\" fill=\"#FFE08A\"><\u002Fcircle><path d=\"M4.5 8.3l2.2 2.2 4.8-4.8\" stroke=\"#1D2230\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>Groups book and pay through one host-free split<\u002Fli>\n<li style=\"display:flex;gap:10px;align-items:flex-start\"><svg style=\"flex:none;margin-top:3px\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><circle cx=\"8\" cy=\"8\" r=\"8\" fill=\"#FFE08A\"><\u002Fcircle><path d=\"M4.5 8.3l2.2 2.2 4.8-4.8\" stroke=\"#1D2230\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>Student offers appear right on plans at your venue<\u002Fli>\n<\u002Ful>\n<p style=\"margin:0;font-size:14px;color:#D5D8E0\">Venue partnerships open once the first campus is live.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<footer style=\"border-top:1px solid #E3E0D6\">\n<div style=\"max-width:1120px;margin:0 auto;padding:32px 24px 40px;display:flex;flex-wrap:wrap;gap:16px 32px;justify-content:space-between;align-items:center;font-size:14px;color:#4A4F5E;box-sizing:border-box\">\n<span>Chalo Campus · for college students aged 18 and over · sample preview<\u002Fspan>\n<nav style=\"display:flex;flex-wrap:wrap;gap:4px 20px\">\n<a href=\"#safety\" style=\"display:inline-flex;align-items:center;min-height:44px\">Community rules<\u002Fa>\n<a href=\"#safety\" style=\"display:inline-flex;align-items:center;min-height:44px\">Report a problem<\u002Fa>\n<a href=\"#safety\" style=\"display:inline-flex;align-items:center;min-height:44px\">Privacy<\u002Fa>\n<a href=\"#safety\" style=\"display:inline-flex;align-items:center;min-height:44px\">Grievance officer<\u002Fa>\n<\u002Fnav>\n<\u002Fdiv>\n<\u002Ffooter>\n\n\n<div role=\"status\" style=\"position:fixed;left:0;right:0;bottom:24px;display:flex;justify-content:center;padding:0 16px;pointer-events:none\">\n<div style=\"background:#1D2230;color:#FFFFFF;padding:14px 20px;border-radius:14px;font-size:15px;max-width:480px;box-shadow:0 8px 24px rgba(29,34,48,0.25)\">{{toast}}<\u002Fdiv>\n<\u002Fdiv>\n\n\n<\u002Fdiv>\n<\u002Fsc-if><\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#D2452B&quot;,&quot;options&quot;:[&quot;#D2452B&quot;,&quot;#2B5FCF&quot;,&quot;#6B46C9&quot;]},&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:4300}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = {\n      filter: 'All',\n      joined: {},\n      open: {},\n      reported: {},\n      nextId: 1,\n      groupSize: 10,\n      email: '',\n      waitError: '',\n      waitDone: false,\n      toast: '',\n      formError: '',\n      form: { title: '', cat: 'Chai', time: 'Today · 5:00 PM', venue: 'Tea stall by the gate', spots: 4, cost: 0, women: false, approve: false },\n      plans: [\n        { id: 'p1', title: 'Chai after the last lecture', cat: 'Chai', when: 'Today · 5:00 PM', where: 'Tea stall by the main gate', spots: 5,\n          going: [{ n: 'Ananya', d: 'Architecture' }, { n: 'Vikram', d: 'Economics' }, { n: 'Sana', d: 'Physics' }],\n          host: { n: 'Rohan', d: 'Mechanical', r: '4.8 rating' }, cost: 0, approve: false, women: false, weekly: false, late: false },\n        { id: 'p2', title: '5-a-side football, all levels welcome', cat: 'Sports', when: 'Sat · 6:00 AM', where: 'Turf near campus', spots: 9,\n          going: [{ n: 'Karthik', d: 'Civil' }, { n: 'Priya', d: 'Psychology' }, { n: 'Neil', d: 'Mechanical' }, { n: 'Tarun', d: 'Chemistry' }, { n: 'Rahul', d: 'Commerce' }, { n: 'Manav', d: 'Electronics' }],\n          host: { n: 'Imran', d: 'Computer Science', r: '4.9 rating' }, cost: 120, approve: false, women: false, weekly: true, late: false },\n        { id: 'p3', title: 'Board games at a quiet café', cat: 'Hangout', when: 'Sat · 4:00 PM', where: 'Café near campus', spots: 5,\n          going: [{ n: 'Zoya', d: 'Design' }, { n: 'Isha', d: 'English' }],\n          host: { n: 'Meera', d: 'Design', r: '4.9 rating' }, cost: 150, approve: true, women: true, weekly: false, late: false },\n        { id: 'p4', title: 'Valorant 5-stack, beginners welcome', cat: 'Gaming', when: 'Sun · 3:00 PM', where: 'Gaming lounge near campus', spots: 4,\n          going: [{ n: 'Manav', d: 'Electronics' }, { n: 'Lakshmi', d: 'Biotechnology' }],\n          host: { n: 'Dev', d: 'Computer Science', r: '4.7 rating' }, cost: 100, approve: false, women: false, weekly: false, late: false },\n        { id: 'p5', title: 'Cubbon Park morning walk', cat: 'Explore', when: 'Sun · 7:00 AM', where: 'Cubbon Park main gate', spots: 7,\n          going: [{ n: 'Lakshmi', d: 'Biotechnology' }],\n          host: { n: 'Kavya', d: 'Biotechnology', r: '4.8 rating' }, cost: 0, approve: false, women: false, weekly: false, late: false },\n        { id: 'p6', title: 'Friday night movie, group booking', cat: 'Movies', when: 'Fri · 7:15 PM', where: 'Mall or multiplex', spots: 5,\n          going: [{ n: 'Vikram', d: 'Economics' }, { n: 'Priya', d: 'Psychology' }, { n: 'Rahul', d: 'Commerce' }],\n          host: { n: 'Arjun', d: 'Civil', r: '4.6 rating' }, cost: 250, approve: false, women: false, weekly: false, late: false }\n      ]\n    };\n  }\n\n  flash(msg) {\n    this.setState({ toast: msg });\n    clearTimeout(this._toastTimer);\n    this._toastTimer = setTimeout(() => this.setState({ toast: '' }), 3200);\n  }\n\n  setForm(patch) {\n    this.setState({ form: Object.assign({}, this.state.form, patch) });\n  }\n\n  renderVals() {\n    const s = this.state;\n    const f = s.form;\n    const accent = this.props.accent ?? '#D2452B';\n    const INK = '#1D2230';\n    const AV = ['#FFD9C9', '#D6ECE4', '#E3DCFA', '#FFF0B8', '#D4E6F7', '#F8DCE2'];\n    const CAT = { Chai: '#FFE3B8', Sports: '#CDEBD8', Gaming: '#DCD4F7', Movies: '#F7D3D9', Explore: '#CFE5F5', Hangout: '#F5DCCB' };\n    const rupee = (v) => '₹' + v.toLocaleString('en-IN');\n    const chip = (label, on, pick) => ({\n      label, on, pick,\n      bg: on ? INK : '#FFFFFF',\n      fg: on ? '#FFFFFF' : INK,\n      bd: on ? INK : '#D9D5C9'\n    });\n\n    const TIMES = [\n      { l: 'Today · 5:00 PM', late: false }, { l: 'Today · 7:30 PM', late: false },\n      { l: 'Tomorrow · 4:00 PM', late: false }, { l: 'Sat · 6:00 AM', late: false },\n      { l: 'Sun · 8:30 PM', late: true }\n    ];\n    const VENUES = ['Campus canteen', 'Tea stall by the gate', 'Café near campus', 'Turf near campus', 'Gaming lounge near campus', 'Cubbon Park', 'Mall or multiplex'];\n    const COSTS = [0, 100, 150, 250];\n    const CATS = ['Chai', 'Sports', 'Gaming', 'Movies', 'Explore', 'Hangout'];\n\n    const catChips = CATS.map((c) => chip(c, f.cat === c, () => this.setForm({ cat: c })));\n    const timeChips = TIMES.map((t) => chip(t.l, f.time === t.l, () => this.setForm({ time: t.l })));\n    const venueChips = VENUES.map((v) => chip(v, f.venue === v, () => this.setForm({ venue: v })));\n    const costChips = COSTS.map((c) => chip(c === 0 ? 'Free' : rupee(c), f.cost === c, () => this.setForm({ cost: c })));\n    const timeObj = TIMES.find((t) => t.l === f.time);\n    const lateOn = !!(timeObj && timeObj.late);\n\n    const toggle = (label, hint, on, flip) => ({ label, hint, on, flip, track: on ? '#0E7561' : '#B9B5A8', knob: on ? '21px' : '3px' });\n    const toggles = [\n      toggle('Women-only plan', 'Only women can see and join', f.women, () => this.setForm({ women: !f.women })),\n      toggle('I approve who joins', 'Joiners send a request first', f.approve, () => this.setForm({ approve: !f.approve }))\n    ];\n\n    const filterNames = ['All', 'Chai', 'Sports', 'Gaming', 'Movies', 'Explore', 'Hangout', 'Women-only'];\n    const filters = filterNames.map((c) => chip(c, s.filter === c, () => this.setState({ filter: c })));\n\n    const visible = s.plans.filter((p) => s.filter === 'All' ? true : (s.filter === 'Women-only' ? p.women : p.cat === s.filter));\n    const plans = visible.map((p) => {\n      const mine = s.joined[p.id];\n      const left = p.spots - p.going.length - (mine === 'in' ? 1 : 0);\n      const full = left <= 0 && !mine;\n      const taken = p.spots - Math.max(left, 0);\n      const names = p.going.map((g) => ({ n: g.n, d: g.d }));\n      if (mine === 'in') names.push({ n: 'You', d: 'Your department' });\n      const avatars = names.slice(0, 4).map((g, i) => ({ ini: g.n.charAt(0).toUpperCase(), bg: AV[i % AV.length] }));\n      let btnLabel, btnBg, btnFg, btnBd;\n      if (mine === 'in') { btnLabel = \"You're in. Tap to leave\"; btnBg = '#E4F0EB'; btnFg = '#0A5A4A'; btnBd = '#0E7561'; }\n      else if (mine === 'req') { btnLabel = 'Requested. Tap to cancel'; btnBg = '#FFF3D1'; btnFg = '#6B4A00'; btnBd = '#E0B84A'; }\n      else if (full) { btnLabel = 'Plan is full'; btnBg = '#ECEAE3'; btnFg = '#4A4F5E'; btnBd = '#ECEAE3'; }\n      else if (p.approve) { btnLabel = 'Ask to join'; btnBg = INK; btnFg = '#FFFFFF'; btnBd = INK; }\n      else { btnLabel = p.cost > 0 ? 'Join · ' + rupee(p.cost) : 'Join'; btnBg = accent; btnFg = '#FFFFFF'; btnBd = accent; }\n      const isOpen = !!s.open[p.id];\n      const isReported = !!s.reported[p.id];\n      let joinNote = 'Group chat opens when you join.';\n      if (p.approve) joinNote = 'The host approves each request.';\n      if (mine === 'in') joinNote = 'Group chat is open. Share this plan with a friend.';\n      if (mine === 'req') joinNote = 'The host will answer soon.';\n      return {\n        id: p.id, title: p.title, cat: p.cat, catBg: CAT[p.cat] || '#EEF0F4',\n        when: p.when, where: p.where, late: p.late, weekly: p.weekly, women: p.women, approve: p.approve,\n        hostIni: p.host.n.charAt(0).toUpperCase(), hostName: p.host.n, hostDept: p.host.d, hostRating: p.host.r,\n        spotsText: full ? 'Full' : left + (left === 1 ? ' spot left' : ' spots left'),\n        fillPct: Math.round((taken / p.spots) * 100) + '%',\n        priceText: p.cost > 0 ? rupee(p.cost) + ' each' : 'Free · everyone pays for their own',\n        hasPrice: p.cost > 0,\n        avatars,\n        going: names,\n        open: isOpen,\n        whoLabel: isOpen ? 'Hide who\\'s going' : 'See who\\'s going (' + names.length + ')',\n        toggleOpen: () => this.setState({ open: Object.assign({}, s.open, { [p.id]: !isOpen }) }),\n        full,\n        cursor: full ? 'not-allowed' : 'pointer',\n        btnLabel, btnBg, btnFg, btnBd, joinNote,\n        onJoin: () => {\n          const j = Object.assign({}, s.joined);\n          if (j[p.id]) { delete j[p.id]; this.setState({ joined: j }); this.flash('Done. You left the plan.'); }\n          else if (p.approve) { j[p.id] = 'req'; this.setState({ joined: j }); this.flash('Request sent to ' + p.host.n + '.'); }\n          else { j[p.id] = 'in'; this.setState({ joined: j }); this.flash(\"You're in. The plan's group chat is open.\"); }\n        },\n        reported: isReported,\n        notReported: !isReported,\n        onReport: () => this.setState({ reported: Object.assign({}, s.reported, { [p.id]: true }) })\n      };\n    });\n\n    const safety = [\n      { title: 'Before you go', items: [\n        { t: 'Only verified students from your college can see plans' },\n        { t: 'Real names and photos, no anonymous profiles' },\n        { t: 'Public places only, picked from a list' },\n        { t: 'See exactly who is going before you join' },\n        { t: 'Hosts can approve joiners, and women-only plans are one filter away' }\n      ] },\n      { title: 'While you are out', items: [\n        { t: 'Groups of 3 or more, no one-on-one plans with strangers' },\n        { t: 'Share your plan with a friend in one tap' },\n        { t: 'An SOS button that alerts a trusted contact' },\n        { t: 'A check-in an hour in: \"Everything okay?\"' },\n        { t: 'Plans after 8 PM need a verified host' }\n      ] },\n      { title: 'After', items: [\n        { t: 'Private ratings for hosts and joiners' },\n        { t: 'Report or block in two taps, from any profile, plan or chat' },\n        { t: 'Every report gets a human look, serious ones first' },\n        { t: 'Warnings, then suspensions, then removal for repeat offenders' },\n        { t: 'Student moderators help out while we are small' }\n      ] }\n    ];\n\n    const steps = [\n      { n: 1, t: 'The plan fills up.' },\n      { n: 2, t: 'Everyone pays their share into hold.' },\n      { n: 3, t: 'The host confirms the booking.' },\n      { n: 4, t: 'The venue gets paid. If the plan falls through, everyone is refunded.' }\n    ];\n\n    const total = 1200;\n    const n = s.groupSize;\n    const share = Math.ceil(total / n);\n    const fee = Math.ceil(share * 0.05);\n\n    const totalPeople = f.spots + 1;\n    return {\n      accent,\n      trust: [{ text: 'College email only' }, { text: 'Public places only' }, { text: 'Groups of 3 or more' }],\n      form: f,\n      titleValue: f.title,\n      onTitle: (e) => this.setForm({ title: e.target.value }),\n      hasFormError: s.formError !== '',\n      formError: s.formError,\n      catChips, timeChips, venueChips, costChips, lateOn, toggles,\n      spotsDown: () => this.setForm({ spots: Math.max(2, f.spots - 1) }),\n      spotsUp: () => this.setForm({ spots: Math.min(12, f.spots + 1) }),\n      groupNote: 'You plus ' + f.spots + ' = ' + totalPeople + ' people. Groups of 3 or more only.',\n      costNote: f.cost > 0 ? 'Everyone pays their share into Chalo. You never front the money.' : 'No booking. Everyone pays for their own.',\n      submitPlan: () => {\n        if (!f.title.trim()) { this.setState({ formError: 'Give your plan a name first.' }); return; }\n        const id = 'n' + s.nextId;\n        const plan = {\n          id, title: f.title.trim(), cat: f.cat, when: f.time, where: f.venue, spots: f.spots, going: [],\n          host: { n: 'You', d: 'Your department', r: 'New host' },\n          cost: f.cost, approve: f.approve, women: f.women, weekly: false, late: lateOn\n        };\n        this.setState({\n          plans: [plan].concat(s.plans), nextId: s.nextId + 1, filter: 'All', formError: '',\n          form: Object.assign({}, f, { title: '' })\n        });\n        this.flash('Plan posted. It is at the top of Plans on your campus.');\n      },\n      filters, plans, noPlans: plans.length === 0,\n      safety, steps,\n      groupSize: n,\n      groupDown: () => this.setState({ groupSize: Math.max(4, n - 1) }),\n      groupUp: () => this.setState({ groupSize: Math.min(14, n + 1) }),\n      total: rupee(total), share: rupee(share), fee: rupee(fee), pay: rupee(share + fee),\n      email: s.email,\n      onEmail: (e) => this.setState({ email: e.target.value, waitError: '', waitDone: false }),\n      hasWaitError: s.waitError !== '',\n      waitError: s.waitError,\n      waitDone: s.waitDone,\n      joinList: () => {\n        if (!/^\\S+@\\S+\\.\\S+$/.test(s.email.trim())) { this.setState({ waitError: 'Enter your college email, like you@yourcollege.edu.', waitDone: false }); return; }\n        this.setState({ waitError: '', waitDone: true });\n      },\n      hasToast: s.toast !== '',\n      toast: s.toast\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
